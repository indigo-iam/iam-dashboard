name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - README.md
      - LICENSE

jobs:
  main:
    name: Release
    runs-on: ubuntu-latest
    environment: "Release"
    env:
      NODE_EXTRA_CA_CERTS: "${{ github.workspace }}/assets/trust/star_test_example_ca.pem"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Add hosts to /etc/hosts
        run: sudo echo "127.0.0.1 iam.test.example" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y voms-clients
          npm ci --ignore-scripts
          npm rebuild better-sqlite3 sharp

      - name: Make self-signed CA and *.test.example certificate
        run: scripts/trust/setup_trust.sh assets/trust

      - name: Run ESLint
        run: npm run lint

      - name: Install Playwright browsers
        run: npm run playwright:install

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: cnafsoftwaredevel/iam-dashboard
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag

      - name: Build and export to Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          build-args: IAM_DASHBOARD_BASE_PATH=/ui
          tags: |
            iam-dashboard:test

      - name: Load test environment
        run: |
          sudo apt-get update && sudo apt-get install -y pwgen uuid
          export IAM_DASHBOARD_CLIENT_ID=$(uuid)
          export IAM_DASHBOARD_CLIENT_SECRET=$(pwgen -1 32)
          export IAM_DASHBOARD_AUTH_SECRET=$(openssl rand -base64 32)
          envsubst < .template.env > .env
          docker compose up -d

      - name: Run Playwright tests
        run: npm run playwright:test

      - name: Cleanup test environment
        run: docker compose down

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 90

      - name: Build and push /ui to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: IAM_DASHBOARD_BASE_PATH=/ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
